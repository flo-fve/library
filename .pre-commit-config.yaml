default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        name: clang-format
        args: [-i]
        types_or: [c, c++, header]
        exclude: ^(build/|external/|third_party/)

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        args: [-p, build, --quiet]
        language: system
        types_or: [c, c++, header]
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$
        pass_filenames: true
        exclude: ^(build/|external/|third_party/)

  - repo: local
    hooks:
      - id: cppcheck
        name: cppcheck
        entry: cppcheck
          --enable=warning,style,performance,portability
          --inline-suppr
          --quiet
          --error-exitcode=1
          --std=c++20
          --language=c++
          -I include
          src
          include
        language: system
        pass_filenames: false
